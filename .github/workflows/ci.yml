name: ci

# The Makefile suite is hermetic: it stubs `docker` and `npm`, needs no
# daemon and no network, and never writes to the checkout. So one job, no
# services and no caching -- if it passes here it passes anywhere.
on:
  push:
    branches: [main, master]
    paths: [Makefile]
  pull_request:
    branches: [main, master]
    paths: [Makefile]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  makefile-test:
    name: Make Targets Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: make test
        run: make test