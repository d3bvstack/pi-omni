---
# Runs the Pi coding agent, plus the self-hosted Supermemory server it uses for
# long-term memory. bin/pi exports PROJECT_DIR, AGENT_DIR, PI_IMAGE and
# SUPERMEMORY_IMAGE, adds the uid, and runs `docker compose run --rm pi`. The
# defaults exist so `docker compose config`, `build` and `up` also work from this
# directory alone.
#
# There are two services now, and the second one shows the pattern the rest
# follow. It is reachable from the agent by name over the shared network Compose
# creates with the first service -- no `ports:`, which is what `http://supermemory:6767`
# in agent/AGENTS.md relies on. A tool the agent should reach but that does not
# need to exist on every launch goes behind a profile instead, so `compose run pi`
# leaves it out until you name it:
#
#   ollama:
#     image: ollama/ollama
#     profiles: [tools]
#     ports: ["11434:11434"]
#     volumes: [ollama:/root/.ollama]
#
# Note the difference: a profiled service is reachable only once something
# starts it, so anything that `depends_on` it must name it unconditionally. A
# local model server on this network becomes `baseUrl: http://ollama:11434/v1` in
# agent/models.json, and a Supermemory service pointed at it becomes
# OPENAI_BASE_URL: http://ollama:11434/v1.
name: pi-agent

services:
  pi:
    image: ${PI_IMAGE:-pi-agent:latest}
    build:
      context: .
      dockerfile: Dockerfile
    # No tty/stdin_open here: `compose run` allocates a terminal unless bin/pi
    # passes -T, and no USER because bin/pi picks the uid per run.
    init: true
    # `service_started`, not `service_healthy`, on purpose. The first boot after
    # a fresh volume downloads the local embedding model, and making every `pi`
    # launch wait on that would be a poor trade for a memory engine the agent
    # only reaches when it chooses to. AGENTS.md tells the agent that a memory
    # call can fail while the engine warms up and must not be retried in a loop.
    depends_on:
      supermemory:
        condition: service_started
    volumes:
      # The project the agent works on, read-write.
      - type: bind
        source: ${PROJECT_DIR:-.}
        target: /workspace
      # The agent's configuration directory, mounted on every launch.
      - type: bind
        source: ${AGENT_DIR:-./agent}
        target: /pi/agent
    # Provider keys, forwarded only when they are set in the launching shell, so
    # no credential is ever stored in this repository. These are the variables
    # `pi --help` documents; re-check that list after an upgrade. Running /login
    # inside the container instead writes the gitignored agent/auth.json and
    # needs nothing here.
    environment: [
      PI_OFFLINE, PI_TELEMETRY,        # Pi's own toggles
      AI_GATEWAY_API_KEY, ANTHROPIC_API_KEY, ANTHROPIC_AUTH_TOKEN,
      ANTHROPIC_OAUTH_TOKEN, ANT_LING_API_KEY, AWS_ACCESS_KEY_ID,
      AWS_BEARER_TOKEN_BEDROCK, AWS_PROFILE, AWS_REGION, AWS_SECRET_ACCESS_KEY,
      AZURE_OPENAI_API_KEY, AZURE_OPENAI_API_VERSION, AZURE_OPENAI_BASE_URL,
      AZURE_OPENAI_DEPLOYMENT_NAME_MAP, AZURE_OPENAI_RESOURCE_NAME,
      BASETEN_API_KEY, CEREBRAS_API_KEY, CLOUDFLARE_ACCOUNT_ID,
      CLOUDFLARE_API_KEY, CLOUDFLARE_GATEWAY_ID, DEEPSEEK_API_KEY,
      FIREWORKS_API_KEY, GEMINI_API_KEY, GROQ_API_KEY, KIMI_API_KEY,
      META_API_KEY, MINIMAX_API_KEY, MISTRAL_API_KEY, MOONSHOT_API_KEY,
      NVIDIA_API_KEY, OPENAI_API_KEY, OPENCODE_API_KEY, OPENROUTER_API_KEY,
      QWEN_TOKEN_PLAN_API_KEY, QWEN_TOKEN_PLAN_CN_API_KEY, TOGETHER_API_KEY,
      XAI_API_KEY, XIAOMI_API_KEY, XIAOMI_TOKEN_PLAN_AMS_API_KEY,
      XIAOMI_TOKEN_PLAN_CN_API_KEY, XIAOMI_TOKEN_PLAN_SGP_API_KEY,
      ZAI_API_KEY, ZAI_CODING_CN_API_KEY,
      # The memory engine's bearer token, printed by supermemory's first boot.
      # The endpoint itself is not a variable: it is the service name on this
      # network, fixed at http://supermemory:6767 and written down in
      # agent/AGENTS.md, so there is nothing to keep in sync.
      SUPERMEMORY_API_KEY,
    ]

  supermemory:
    # The long-term memory engine. Two images, and the version lives only in
    # Dockerfile.supermemory's ARG, the same way PI_VERSION lives only in the
    # agent Dockerfile -- this `image:` names the built result, it does not
    # version it.
    image: ${SUPERMEMORY_IMAGE:-supermemory-server:local}
    build:
      context: .
      dockerfile: Dockerfile.supermemory
    # No `profiles:` entry. A profiled service is left out of `compose run pi`,
    # and then the agent's lookup of "supermemory" fails outright rather than
    # degrading. This one is needed on every launch.
    #
    # No `ports:` either, and that is load-bearing rather than incidental. The
    # pinned release (0.0.8) binds every interface and its implicit local
    # authentication is unsafe on an untrusted network -- Supermemory's own
    # self-hosting docs say so in as many words. This project's network is the
    # isolation. A later release binds loopback and enforces the key it prints;
    # only then is a published port defensible, and it would want TLS and access
    # control in front of it.
    environment:
      # One LLM provider, required for summaries, contextual chunking and memory
      # extraction. There is no wizard without a TTY, so this cannot be
      # interactive. OpenRouter is not a provider the server knows; it is
      # OpenAI-compatible, so it arrives through the OPENAI_* pair.
      OPENAI_BASE_URL: https://openrouter.ai/api/v1
      OPENAI_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_MODEL: ${SUPERMEMORY_MODEL:-thinkingmachines/inkling-small:free}
      SUPERMEMORY_DATA_DIR: /var/lib/supermemory
      SUPERMEMORY_DISABLE_TELEMETRY: "1"
      # Local embeddings (Xenova/bge-base-en-v1.5, 768d) are the default and
      # need no key. Set SUPERMEMORY_EMBEDDING_PROVIDER and friends in .env to
      # move them off the machine; the dimension is then locked to whatever the
      # stored vectors already are, so changing it means starting a new volume.
    volumes:
      - supermemory:/var/lib/supermemory
    healthcheck:
      # The docs publish no health endpoint. `/` is the server's browser welcome
      # page, so a 200 means the engine is answering. Revisit this if a real
      # health path is ever documented.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:6767/"]
      interval: 10s
      timeout: 5s
      # Long, because a fresh volume's first boot downloads the embedding model.
      start_period: 180s
      retries: 5
    # The engine holds the only copy of the memory graph and the embedding
    # cache, so it stays up across restarts. `make clean` does not remove the
    # volume either; see the README for how to discard it deliberately.
    restart: unless-stopped

volumes:
  # Graph engine data, the auth secret and the embedding model cache. Named, so
  # it is not a bind into the repository and `make clean` leaves it alone.
  supermemory:
